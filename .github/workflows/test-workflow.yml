name: Tests

on:
  pull_request:
    branches:
      - "master"
  push:
    branches:
      - "master"

jobs:

  testLinux:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Test
        run: mvn clean test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  testWindows:
    runs-on: windows-latest

    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Test
        run: mvn clean test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  testMac:
    runs-on: macos-latest

    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Test
        run: mvn clean test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}